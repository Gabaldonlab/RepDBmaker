# Default workflow profile — LOCAL execution.
#
# Snakemake auto-loads workflow/profiles/default/, so a plain
#     snakemake -j <cores>
# runs the whole pipeline on the local machine, no extra flags needed.
#
# For cluster execution, pass another profile explicitly:
#     snakemake --workflow-profile workflow/profiles/slurm   # generic SLURM (edit the CHANGE_ME values first)

executor: local
sdm: conda            # build/use the conda envs in workflow/envs/ (remove if you manage deps yourself)

keep-going: true
rerun-incomplete: true
printshellcmds: true

