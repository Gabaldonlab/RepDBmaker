# Database configuration
versions:
  gtdb: "release226" # use latest to use most recent version
  unieuk: "0.0.1-pre_release"
  EukProt: "3" # only available option as of now
  taxdump: "2026-07-01" # use latest to use most recent version

# Test mode: build a tiny RepDB to run the whole pipeline end-to-end quickly by
# keeping only a few genomes per source (gtdb, virus, uniprot, eukprot, p10k,
# custom). false = off (default); true = 10 per source; an integer = that many
# per source. NOTE: this only subsamples the per-genome sequence fetching/DB
# build; the large downloads (GTDB tarball, EukProt archive, virus zip) and
# the QC/Krona reports still run on the full sources. Mutually exclusive with
# reproduce mode (a pinned universe).
test: false

dbs:
  type: ["diamond", "mmseqs"]  # Available database types: diamond, mmseqs, blastp
  # Which databases to build
  build:
    repdb:
      # Reproduce mode: to rebuild a previous release (e.g. RepDB v1.0) regardless
      # of how the online sources have drifted, pin the frozen UNIVERSE - the
      # enriched table of every available proteome (id, source, 7 ranks,
      # completeness, annotated). When set, the taxonomy harmonization is skipped,
      # the taxdump is the full pinned universe, and the eukaryote selection
      # re-runs deterministically on it. Freeze one from a full run with:
      #   cp results/universe/universe.tsv resources/repdb_v1.0.universe.tsv
      # universe: resources/repdb_v1.0.universe.tsv
      #
      # Eukaryote downsampling: how the redundant public eukaryotic proteomes
      # are thinned before building RepDB. The whole `downsample` block is
      # optional; omit it (or any key) to fall back to the defaults shown here.
      downsample:
        # keep only the most complete proteome per species (identical 7-rank
        # lineage). Set to false to keep every proteome.
        remove_duplicated_species: true # logical: true/false 
        # within each genus, keep at most this many species (most complete).
        top_n_genuses: 3
        # cap over-represented clades: within each named clade keep at most `n`
        # (most complete) genomes per FAMILY; genomes with no family are all
        # kept. `rank` is one of phylum / class / order / family. Edit, add or
        # remove entries freely. Set to False if no reduction is desired.
        reduce_abundant_clades: # false
          - {rank: class,  taxon: Opisthokonta, n: 20}
          - {rank: order,  taxon: Ciliophora,   n: 20}
          - {rank: family, taxon: Embryophyta,  n: 20}
      decontaminate:
        # these parameters were optimized through a benchmark with ContScout
        identity: 0.9
        coverage: 0.5
        cov_mode: 3
        prop_euka: 0.5
        # filter mode: 'soft' keeps flagged contaminants in the DB (default),
        # 'hard' removes them. A contaminants.tsv (flagged proteins + cluster
        # properties) is written in both modes.
        filter: soft
        # size_cluster: 10
    # # Custom databases: uncomment and add your database entries
    # # Example:
    # custom:
    #   clusteredrepdb: 
    #     ids: resources/repdb_v1.0.manifest.tsv
    #     cluster: 
    #       level: class
    #       identity: 0.9
    #       coverage: 0.9
      # diatoms: 
      #   ids: resources/diatomeae.ids
      #   cluster: 
      #     level: genus
      #     identity: 0.9
      #     coverage: 0.9
      #   decontaminate:
      #     prop_euka: 0.5
      # random: 
      #   ids: resources/random_500.ids
      #   cluster: 
      #     level: phylum
      #     identity: 0.4
      #     coverage: 0.3
      # nctv: 
      #   ids: resources/nctv.ids
      #   cluster: 
      #     level: order
      #     identity: 0.8
      #     coverage: 0.8
      # smalleuks: 
      #   ids: resources/eukas_50.ids
      #   cluster: 
      #     level: order
      #     identity: 0.8
      #     coverage: 0.8
      #   decontaminate:
      #     identity: 0.9
      #     coverage: 0.5
      #     cov_mode: 3
      #     prop_euka: 0.5

# If repdb is not specified and you specified to decontaminate your custom database, 
# the pipeline will still produce the repdb.fa.gz
# Right now there is no option to do that as temp because it seems too complicated to manage :=)

files:
  clades_to_keep: "resources/clades_tokeep.txt"
  genomes_to_exclude: "resources/exclude.txt"
  new_genomes: "resources/custom_genomes_repdb.csv"
  # optional: BUSCO/completeness scores for custom proteomes (id<TAB>completeness),
  # carried into the universe / provenance metadata.
  # new_genomes_busco: "resources/custom_busco.tsv"
  # optional: a committed RepDB selection (id list) to diff a fresh selection
  # against; rule repdb_ids_diff writes results/qc/repdb_ids_diff.txt (soft, not
  # a gate). See docs/split-pipeline.md.
  # repdb_ids_reference: "resources/repdb_v1.0.ids"
